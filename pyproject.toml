[project]
name = "ner-bench"
version = "0.1.0"
description = "Benchmarking toolkit for Named Entity Recognition (NER) and Relation Extraction (RE) models"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["ner", "relation-extraction", "benchmark", "nlp", "gliner", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "neo4j-graphrag",
    "langchain",
    "gliner2",
    "python-dotenv>=1.0.0",
    "openai>=2.8.1",
    "langextract>=1.1.1",
    "pydantic>=2.12.5",
    "gliner>=0.2.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ner-eval"
Repository = "https://github.com/yourusername/ner-eval"
Issues = "https://github.com/yourusername/ner-eval/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
